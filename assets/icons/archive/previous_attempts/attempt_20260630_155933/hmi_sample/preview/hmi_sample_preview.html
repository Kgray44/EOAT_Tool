<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chunky Industrial HMI Sample Icons</title>
  <style>
    :root {
      --primary: #00A6C8;
      --accent: #A6CE39;
      --machine: #9AA6AD;
      --dark: #1E2A32;
      --page: #F6F8FA;
      --border: #D6DEE4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--dark); font-family: "Segoe UI", Arial, sans-serif; }
    header { padding: 28px 32px 18px; background: #fff; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    main { padding: 24px 32px 36px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-height: 178px; }
    .icons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; min-height: 94px; }
    img { width: 82px; height: 82px; justify-self: center; }
    .tile { width: 92px; height: 92px; }
    .checker { display: grid; place-items: center; height: 94px; border-radius: 8px; background:
      linear-gradient(45deg, #eef2f5 25%, transparent 25%),
      linear-gradient(-45deg, #eef2f5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eef2f5 75%),
      linear-gradient(-45deg, transparent 75%, #eef2f5 75%);
      background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
    h2 { margin: 12px 0 5px; font-size: 16px; letter-spacing: 0; }
    code { color: var(--primary); font-size: 12px; }
  </style>
</head>
<body>
  <header><h1>Chunky Industrial HMI Sample Icons</h1></header>
  <main><section class="grid">
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/robot.svg" alt="Robot standalone"></div>
          <img class="tile" src="../svg/tile/robot.svg" alt="Robot tile">
        </div>
        <h2>Robot</h2>
        <code>robot</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/mold.svg" alt="Mold standalone"></div>
          <img class="tile" src="../svg/tile/mold.svg" alt="Mold tile">
        </div>
        <h2>Mold</h2>
        <code>mold</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/eoat.svg" alt="EOAT standalone"></div>
          <img class="tile" src="../svg/tile/eoat.svg" alt="EOAT tile">
        </div>
        <h2>EOAT</h2>
        <code>eoat</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/injection_unit.svg" alt="Injection Unit standalone"></div>
          <img class="tile" src="../svg/tile/injection_unit.svg" alt="Injection Unit tile">
        </div>
        <h2>Injection Unit</h2>
        <code>injection_unit</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/vacuum.svg" alt="Vacuum standalone"></div>
          <img class="tile" src="../svg/tile/vacuum.svg" alt="Vacuum tile">
        </div>
        <h2>Vacuum</h2>
        <code>vacuum</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/pressure_air.svg" alt="Pressure Air standalone"></div>
          <img class="tile" src="../svg/tile/pressure_air.svg" alt="Pressure Air tile">
        </div>
        <h2>Pressure Air</h2>
        <code>pressure_air</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/compatibility.svg" alt="Compatibility standalone"></div>
          <img class="tile" src="../svg/tile/compatibility.svg" alt="Compatibility tile">
        </div>
        <h2>Compatibility</h2>
        <code>compatibility</code>
      </article>
      <article class="card">
        <div class="icons">
          <div class="checker"><img src="../svg/standalone/machine.svg" alt="Machine standalone"></div>
          <img class="tile" src="../svg/tile/machine.svg" alt="Machine tile">
        </div>
        <h2>Machine</h2>
        <code>machine</code>
      </article>
  </section></main>
</body>
</html>
