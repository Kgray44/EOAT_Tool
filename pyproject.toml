[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    # Temporary stabilization ignores for existing lint debt in the overnight branch.
    # Keep Ruff active for the selected families without applying broad unsafe rewrites pre-merge.
    "E501",
    "B007",
    "B905",
    "F402",
    "F841",
    "SIM101",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM115",
    "SIM118",
    "SIM212",
    "UP028",
]


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tools/*.py" = ["E402"]
"scripts/ci_smoke_check.py" = ["E402"]
"scripts/migrate_air_circuit_architecture.py" = ["E402"]
"scripts/publish_release.py" = ["E402"]
"scripts/validate_launcher_update.py" = ["E402"]
"server/eoat_api/app.py" = ["B008"]
"core/library_data_service.py" = ["E731", "UP038"]
"app/atlas/minimalist/settings_page.py" = ["F401", "I001"]
