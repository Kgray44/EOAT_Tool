name: Deployment assets

on:
  push:
    branches: [codex/web-foundation-phase0]
  pull_request:
    paths:
      - deployment/**
      - server/eoat_api/web_content.py
      - tests/test_deployment_system.py
      - tests/test_phase3_*.py
      - tests/test_web_*.py
      - web/**

jobs:
  deployment-assets:
    runs-on: ubuntu-latest
    env:
      EOAT_RUN_REAL_FRONTEND_GENERATION_ACTIVATION: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Linux Qt runtime for the token-authority export
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install isolated web build and browser prerequisites
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - run: python -m ruff check deployment server/eoat_api tests/test_deployment_system.py tests/test_frontend_generation.py tests/test_phase3_client.py tests/test_phase3_privileged_helper.py tests/test_web_content_delivery.py tests/test_web_hosting_assets.py
      - run: python -m pytest -q tests/test_deployment_system.py tests/test_frontend_generation.py tests/test_phase3_client.py tests/test_phase3_privileged_helper.py tests/test_web_content_delivery.py tests/test_web_hosting_assets.py
      - run: bash -n deployment/privileged/install_helper.sh deployment/privileged/uninstall_helper.sh
      - working-directory: web
        run: |
          pnpm run api:check
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run test:e2e
          pnpm run build
