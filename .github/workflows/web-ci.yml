name: EOAT Atlas Web CI

on:
  pull_request:
    paths: ["web/**", "scripts/export_openapi_schema.py", ".github/workflows/web-ci.yml", "server/eoat_api/**"]
  push:
    branches: ["codex/web-foundation-phase0"]
    paths: ["web/**", "scripts/export_openapi_schema.py", ".github/workflows/web-ci.yml", "server/eoat_api/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python -m pip install -r requirements.txt
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run format:check
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm exec playwright install chromium
      - working-directory: web
        run: npm run test:e2e
      - working-directory: web
        run: npm run api:check
      - working-directory: web
        run: npm run build
