name: EOAT Atlas Web CI

on:
  pull_request:
    paths: ["web/**", "scripts/export_openapi_schema.py", ".github/workflows/web-ci.yml", "server/eoat_api/**"]
  push:
    branches: ["codex/web-foundation-phase0"]
    paths: ["web/**", "scripts/export_openapi_schema.py", ".github/workflows/web-ci.yml", "server/eoat_api/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: python -m pip install -r requirements.txt
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm run format:check
      - working-directory: web
        run: pnpm run lint
      - working-directory: web
        run: pnpm run typecheck
      - working-directory: web
        run: pnpm test
      - working-directory: web
        run: pnpm exec playwright install chromium
      - working-directory: web
        run: pnpm run test:e2e
      - working-directory: web
        run: pnpm run api:check
      - working-directory: web
        run: pnpm run build
