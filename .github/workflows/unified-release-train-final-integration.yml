name: Unified Release Train Final Integration

on:
  push:
    branches: [integration/unified-release-train-final, integration/production-signing-foundation-0.24.0, integration/production-release-0241-seal-confirmation, integration/windows-web-staging-cleanup-0241, integration/candidate-web-staging-isolation-0241, main]
  workflow_dispatch:

permissions: {contents: read}

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  release-set-and-receipt-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_release_set_v2.py tests/test_release_set_sealing.py tests/test_release_phase_1c.py tests/test_release_train_phase_1b2.py

  server-web-and-source-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.9.0'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run api:check
      - run: pnpm --dir web run typecheck && pnpm --dir web run lint && pnpm --dir web run test && pnpm --dir web run build
      - run: python -m pytest -q tests/test_release_deployment_convergence.py tests/test_release_train_phase_1b2.py -k 'web or bundle or server'

  windows-packaged-startup-chain:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.lock
      - run: python scripts/build_package.py
      - run: '& "dist/EOAT Atlas/EOAT Atlas.exe" --smoke-test --smoke-receipt "$env:RUNNER_TEMP/desktop-smoke.json"'
      - run: python scripts/build_launcher.py
      - run: '& "dist/launcher/EOAT Atlas Launcher.exe" --smoke-test --smoke-receipt "$env:RUNNER_TEMP/launcher-smoke.json"'
      - run: python scripts/build_bootstrap.py
      - run: '& "dist/bootstrap/EOAT Atlas Bootstrap.exe" --smoke-test --smoke-receipt "$env:RUNNER_TEMP/bootstrap-smoke.json"'
      - run: python -m pytest -q tests/test_bootstrap_startup_chain.py tests/test_signed_launcher_update.py tests/test_packaged_smoke_mode.py tests/test_production_signing_dpapi.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-integration-windows-packages
          path: |
            dist
            ${{ runner.temp }}/desktop-smoke.json
            ${{ runner.temp }}/launcher-smoke.json
            ${{ runner.temp }}/bootstrap-smoke.json
          if-no-files-found: error

  mysql-activation-and-recovery:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: disposable-root-password, MYSQL_DATABASE: eoat_disposable}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      EOAT_MYSQL_HOST: 127.0.0.1
      EOAT_MYSQL_PORT: '3306'
      EOAT_MYSQL_USER: root
      EOAT_MYSQL_PASSWORD: disposable-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/integration/test_phase_3a_mysql84.py tests/test_phase_3a_coordinated_deployment.py

  browser-api-desktop-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.9.0'}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run test:e2e
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_release_status_contract.py tests/test_phase_3a_coordinated_deployment.py -k 'parity or drift or status'
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: final-integration-playwright, path: web/test-results, if-no-files-found: ignore}

  signed-channels-publication-and-planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_phase_3b_channels.py tests/test_phase_3a_receipts_and_cli.py tests/test_release_status_contract.py

  fresh-final-candidate-core:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.9.0'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - shell: pwsh
        run: |
          $env:PATH = "$env:PNPM_HOME;$env:PATH"
          Push-Location web
          pnpm exec playwright install chromium
          Pop-Location
          $env:EOAT_FINAL_RELEASE_CANDIDATE = '1'
          $version = (Get-Content app/atlas/version.json -Raw | ConvertFrom-Json).version
          python tools/eoat_release.py --json candidate prepare --version $version | Out-File -Encoding utf8 "$env:RUNNER_TEMP/candidate-result.json"
          if ($LASTEXITCODE -ne 0) { throw 'fresh candidate preparation failed' }
          $result = Get-Content "$env:RUNNER_TEMP/candidate-result.json" -Raw | ConvertFrom-Json
          $result.data.candidate.candidate_id | Out-File -Encoding ascii candidate-id.txt
          python tools/eoat_release.py candidate build-core-artifacts $result.data.candidate.candidate_id
      - uses: actions/upload-artifact@v4
        with:
          name: final-fresh-unsigned-candidate
          path: |
            .local/release-deployment-console
            candidate-id.txt
          if-no-files-found: error

  fresh-final-windows-attachment:
    needs: fresh-final-candidate-core
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: final-fresh-unsigned-candidate, path: "${{ runner.temp }}/final-candidate"}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.lock
      - shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'final-candidate'
          $id = (Get-Content (Join-Path $root 'candidate-id.txt') -Raw).Trim()
          $receipt = Join-Path $root ".local/release-deployment-console/candidate/$id.json"
          python scripts/export_windows_attachment.py --candidate-receipt $receipt --output (Join-Path $env:RUNNER_TEMP 'final-windows-attachment')
      - uses: actions/upload-artifact@v4
        with:
          name: final-fresh-windows-attachment
          path: "${{ runner.temp }}/final-windows-attachment"
          if-no-files-found: error

  fresh-final-sealing-and-disposable-publication:
    needs: [fresh-final-candidate-core, fresh-final-windows-attachment]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: final-fresh-unsigned-candidate, path: .}
      - uses: actions/download-artifact@v4
        with: {name: final-fresh-windows-attachment, path: final-windows-attachment}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Create ephemeral final-validation signing key
        shell: pwsh
        run: |
          @'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          raw = key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())
          public = key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          path = Path(os.environ['RUNNER_TEMP']) / 'final-validation-ed25519.key'
          path.write_bytes(raw)
          print('EOAT_RELEASE_SIGNING_KEY_ID=final-validation-ephemeral')
          print('EOAT_RELEASE_TEST_PRIVATE_KEY_FILE=' + str(path))
          print('EOAT_RELEASE_TRUSTED_PUBLIC_KEYS_JSON=' + json.dumps({'final-validation-ephemeral': base64.b64encode(public).decode('ascii')}, separators=(',', ':')))
          '@ | python - | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Attach, seal, verify, and publish only to disposable roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $id = (Get-Content candidate-id.txt -Raw).Trim()
          python tools/eoat_release.py candidate attach-platform-artifacts $id final-windows-attachment
          python tools/eoat_release.py candidate verify-platform-artifacts $id
          python tools/eoat_release.py candidate verify-for-sealing $id
          python tools/eoat_release.py candidate seal-release-set $id --confirm "SEAL $id"
          python tools/eoat_release.py candidate verify-sealed-release-set $id
          $remote = Join-Path $env:RUNNER_TEMP 'disposable-remote.git'
          $registry = Join-Path $env:RUNNER_TEMP 'disposable-registry'
          $source = Join-Path $env:RUNNER_TEMP 'disposable-publication-source'
          git init --bare $remote
          git clone --no-local $PWD $source
          git -C $source config user.name 'EOAT Atlas disposable validation'
          git -C $source config user.email 'eoat-validation@invalid.example'
          git -C $source remote set-url origin $remote
          Copy-Item -LiteralPath '.local' -Destination (Join-Path $source '.local') -Recurse
          Push-Location $source
          python tools/eoat_release.py publish start-disposable $id --remote $remote --registry $registry --confirm "PUBLISH $id"
          Pop-Location
          Remove-Item -LiteralPath $env:EOAT_RELEASE_TEST_PRIVATE_KEY_FILE -Force
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-fresh-candidate-evidence
          path: .local/release-deployment-console/candidates/**
          if-no-files-found: warn

  repository-safety-and-version-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/repo_safety_audit.py
      - run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            python -c "import json; version=json.load(open('app/atlas/version.json'))['version']; assert sum(r['application_version'] == version for r in json.load(open('release_history.json'))['releases']) == 1"
          elif [ "$GITHUB_REF_NAME" = "integration/production-release-0241-seal-confirmation" ] || [ "$GITHUB_REF_NAME" = "integration/windows-web-staging-cleanup-0241" ] || [ "$GITHUB_REF_NAME" = "integration/candidate-web-staging-isolation-0241" ]; then
            python scripts/check_version_bump.py --base origin/main --allow-governed-component-change
          else
            python scripts/check_version_bump.py --base origin/main
          fi
      - run: python -m compileall -q app bootstrap deployment launcher release_tools server tools
      - run: python -m ruff check app bootstrap deployment launcher release_tools server scripts tools
      - run: python scripts/validate_documented_commands.py

  final-integration-acceptance:
    needs: [release-set-and-receipt-regression, server-web-and-source-candidate, windows-packaged-startup-chain, mysql-activation-and-recovery, browser-api-desktop-parity, signed-channels-publication-and-planning, fresh-final-candidate-core, fresh-final-windows-attachment, fresh-final-sealing-and-disposable-publication, repository-safety-and-version-governance]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Final integration gates completed using disposable CI infrastructure only.'
