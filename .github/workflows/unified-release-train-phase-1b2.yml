name: Unified Release Train Phase 1B-2

on:
  push:
    branches: ["codex/unified-release-train"]
  pull_request:
    paths:
      - deployment/convergence/**
      - release_tools_console/**
      - scripts/build_package.py
      - scripts/build_launcher.py
      - scripts/export_windows_attachment.py
      - app/atlas/main.py
      - launcher/**
      - .github/workflows/unified-release-train-phase-1b2.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  model-receipt-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_release_set_v2.py tests/test_release_deployment_convergence.py
      - run: python -m ruff check deployment/convergence release_tools_console scripts app/atlas/main.py launcher/cli.py
      - run: python tools/eoat_release.py --help

  core-artifacts:
    runs-on: windows-latest
    steps:
      # The retained candidate bundle is deliberately a delta from its
      # declared base commit, so a depth-1 checkout cannot construct or
      # independently prove that recovery artifact.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22.13.0"}
      - uses: pnpm/action-setup@v4
        with: {version: "11.9.0", run_install: false}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          "$env:PNPM_HOME" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$env:PNPM_HOME;$env:PATH"
          pnpm --version
          Push-Location web
          pnpm exec playwright install chromium
          Pop-Location
          git status --short
      - run: |
          $env:PATH = "$env:PNPM_HOME;$env:PATH"
          $version = (Get-Content app/atlas/version.json -Raw | ConvertFrom-Json).version
          python tools/eoat_release.py --json candidate prepare --version $version | Out-File -Encoding utf8 "$env:RUNNER_TEMP\candidate-result.json"
      - run: |
          $result = Get-Content "$env:RUNNER_TEMP\candidate-result.json" -Raw | ConvertFrom-Json
          $result.data.candidate.candidate_id | Out-File -Encoding ascii candidate-id.txt
          python tools/eoat_release.py candidate build-core-artifacts $result.data.candidate.candidate_id
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate
          path: |
            .local/release-deployment-console
            candidate-id.txt
          if-no-files-found: error

  windows-packaged-artifacts:
    needs: core-artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        # Keep transferred candidate receipts out of the checkout: the
        # package builder deliberately refuses any dirty source tree.
        with:
          name: unsigned-candidate
          path: ${{ runner.temp }}/unsigned-candidate
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # Desktop and launcher packaging use the repository-pinned PyInstaller
      # toolchain, which is intentionally isolated from the general runtime
      # and test dependency locks.
      - run: python -m pip install -r requirements-build.lock
      - run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'unsigned-candidate'
          $id = (Get-Content (Join-Path $candidateRoot 'candidate-id.txt') -Raw).Trim()
          $receipt = Join-Path $candidateRoot ".local/release-deployment-console/candidate/$id.json"
          python scripts/export_windows_attachment.py --candidate-receipt $receipt --output (Join-Path $env:RUNNER_TEMP 'windows-attachment')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-platform-attachment
          path: ${{ runner.temp }}/windows-attachment
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-diagnostics
          path: ${{ runner.temp }}/windows-attachment/diagnostics
          if-no-files-found: warn

  attachment-verification:
    needs: [core-artifacts, windows-packaged-artifacts]
    runs-on: windows-latest
    steps:
      # Version governance compares this candidate to the declared convergence
      # base, which is intentionally older than a depth-one checkout.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: unsigned-candidate, path: .}
      - uses: actions/download-artifact@v4
        with: {name: windows-platform-attachment, path: windows-attachment}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          $id = (Get-Content candidate-id.txt -Raw).Trim()
          python tools/eoat_release.py candidate inspect-platform-attachment $id windows-attachment
          python tools/eoat_release.py candidate attach-platform-artifacts $id windows-attachment
          # Reattaching byte-identical immutable CI output is explicitly
          # idempotent; a focused service test below also proves conflicts and
          # failed transactions preserve the existing receipt.
          python tools/eoat_release.py candidate attach-platform-artifacts $id windows-attachment
          python tools/eoat_release.py candidate verify-platform-artifacts $id
          python tools/eoat_release.py --json candidate show-components $id | Out-File -Encoding utf8 components.json
          if ((Get-Content components.json -Raw) -notmatch 'release_set_manifest') { throw 'final sealing components not reported' }
      - run: python -m pytest -q tests/test_release_train_phase_1b2.py
      - run: python scripts/repo_safety_audit.py
      - run: |
          git fetch --no-tags origin main
          python scripts/check_version_bump.py --base origin/main

  sealing-transaction:
    needs: [core-artifacts, windows-packaged-artifacts]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: unsigned-candidate, path: .}
      - uses: actions/download-artifact@v4
        with: {name: windows-platform-attachment, path: windows-attachment}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Create ephemeral non-production signing key
        shell: pwsh
        run: |
          @'
          import base64, json
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          private = Ed25519PrivateKey.generate()
          raw_private = private.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())
          raw_public = private.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          from pathlib import Path
          key_path = Path(__import__("os").environ["RUNNER_TEMP"]) / "eoat-phase-1b3-private.key"
          key_path.write_bytes(raw_private)
          print("EOAT_RELEASE_SIGNING_KEY_ID=ci-phase-1b3-test")
          print("EOAT_RELEASE_TEST_PRIVATE_KEY_FILE=" + str(key_path))
          print("EOAT_RELEASE_TRUSTED_PUBLIC_KEYS_JSON=" + json.dumps({"ci-phase-1b3-test": base64.b64encode(raw_public).decode("ascii")}, separators=(",", ":")))
          '@ | python - | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Revalidate, seal, and verify a complete candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Release { & python @args; if ($LASTEXITCODE -ne 0) { throw "eoat_release failed: $args" } }
          $id = (Get-Content candidate-id.txt -Raw).Trim()
          Invoke-Release tools/eoat_release.py candidate attach-platform-artifacts $id windows-attachment
          Invoke-Release tools/eoat_release.py candidate verify-for-sealing $id
          Invoke-Release tools/eoat_release.py candidate seal-release-set $id --confirm "SEAL $id"
          Invoke-Release tools/eoat_release.py candidate seal-release-set $id --confirm "SEAL $id"
          Invoke-Release tools/eoat_release.py candidate verify-sealed-release-set $id
          & python tools/eoat_release.py --json candidate show $id | Out-File -Encoding utf8 sealed-candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'sealed candidate inspection failed' }
          $sealed = Get-Content sealed-candidate.json -Raw
          if ($sealed -notmatch 'RELEASE_SET_VALIDATED' -or $sealed -notmatch 'publication_eligible') { throw 'sealed candidate status was not recorded' }
          Remove-Item -LiteralPath $env:EOAT_RELEASE_TEST_PRIVATE_KEY_FILE -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-release-set-evidence
          path: |
            sealed-candidate.json
            .local/release-deployment-console/candidates/**/sealing
            .local/release-deployment-console/candidates/**/receipts/sealing-*.json
          if-no-files-found: warn
      - run: python -m pytest -q tests/test_release_set_sealing.py
      - run: python scripts/repo_safety_audit.py
      - run: |
          git fetch --no-tags origin main
          python scripts/check_version_bump.py --base origin/main

  documentation-command-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/eoat_release.py candidate --help
      - run: python scripts/validate_documented_commands.py
