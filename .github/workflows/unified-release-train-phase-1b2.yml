name: Unified Release Train Phase 1B-2

on:
  push:
    branches: ["codex/unified-release-train"]
  pull_request:
    paths:
      - deployment/convergence/**
      - release_tools_console/**
      - scripts/build_package.py
      - scripts/build_launcher.py
      - scripts/export_windows_attachment.py
      - app/atlas/main.py
      - launcher/**
      - .github/workflows/unified-release-train-phase-1b2.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  model-receipt-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_release_set_v2.py tests/test_release_deployment_convergence.py
      - run: python -m ruff check deployment/convergence release_tools_console scripts app/atlas/main.py launcher/cli.py
      - run: python tools/eoat_release.py --help

  core-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22.13.0"}
      - uses: pnpm/action-setup@v4
        with: {version: "11.9.0", run_install: false}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/eoat_release.py --json candidate prepare --version 0.24.0 | Out-File -Encoding utf8 candidate-result.json
      - run: |
          $result = Get-Content candidate-result.json -Raw | ConvertFrom-Json
          $result.data.candidate.candidate_id | Out-File -Encoding ascii candidate-id.txt
          python tools/eoat_release.py candidate build-core-artifacts $result.data.candidate.candidate_id
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate
          path: |
            .local/release-deployment-console
            candidate-id.txt
          if-no-files-found: error

  windows-packaged-artifacts:
    needs: core-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: unsigned-candidate, path: .}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          $id = (Get-Content candidate-id.txt -Raw).Trim()
          python scripts/export_windows_attachment.py --candidate-receipt ".local/release-deployment-console/candidate/$id.json" --output windows-attachment
      - uses: actions/upload-artifact@v4
        with:
          name: windows-platform-attachment
          path: windows-attachment
          if-no-files-found: error

  attachment-verification:
    needs: [core-artifacts, windows-packaged-artifacts]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/download-artifact@v4
        with: {name: unsigned-candidate, path: .}
      - uses: actions/download-artifact@v4
        with: {name: windows-platform-attachment, path: windows-attachment}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          $id = (Get-Content candidate-id.txt -Raw).Trim()
          python tools/eoat_release.py candidate inspect-platform-attachment $id windows-attachment
          python tools/eoat_release.py candidate attach-platform-artifacts $id windows-attachment
          python tools/eoat_release.py candidate verify-platform-artifacts $id
          python tools/eoat_release.py --json candidate show-components $id | Out-File -Encoding utf8 components.json
          if ((Get-Content components.json -Raw) -notmatch 'release_set_manifest') { throw 'final sealing components not reported' }
      - run: python scripts/repo_safety_audit.py
      - run: python scripts/check_version_bump.py --base 170d9fb3d8f2ab2dabe6eb86ee7898ccbbd3a6ab

  documentation-command-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/eoat_release.py candidate --help
      - run: python scripts/validate_documented_commands.py
